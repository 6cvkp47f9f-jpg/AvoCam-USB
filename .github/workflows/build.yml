name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build (No Signing)
        run: |
          xcodebuild \
            -project AvoCamUSB.xcodeproj \
            -scheme AvoCamUSB \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/AvoCamUSB.app Payload/
          zip -r AvoCamUSB.ipa Payload
          rm -rf Payload

      - name: Get Version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" AvoCamUSB/Resources/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" AvoCamUSB/Resources/Info.plist)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build=${BUILD}" >> $GITHUB_OUTPUT

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AvoCamUSB-v${{ steps.version.outputs.version }}-b${{ steps.version.outputs.build }}
          path: AvoCamUSB.ipa

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: AvoCamUSB-v${{ steps.version.outputs.version }}-b${{ steps.version.outputs.build }}.app
          path: build/Build/Products/Release-iphoneos/AvoCamUSB.app
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2 \
            --repo ${{ github.repository }} \
            --title "AvoCamUSB v1.2" \
            --notes "锁定采集帧率版本" \
            AvoCamUSB.ipa || true
