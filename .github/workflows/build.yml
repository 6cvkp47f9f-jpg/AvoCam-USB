name: Build English iOS App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply English interface and timestamp fix
        run: git apply --check english-camera.patch && git apply english-camera.patch
      - name: Check timestamp rollover arithmetic
        run: swift TimestampTests.swift
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: xcodebuild -project AvoCamUSB.xcodeproj -scheme AvoCamUSB -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AvoCamUSB.app Payload/
          zip -r AvoCamUSB-English-v1.5.1-b7.ipa Payload
      - name: Upload English IPA
        uses: actions/upload-artifact@v4
        with:
          name: AvoCamUSB-English-v1.5.1-b7
          path: AvoCamUSB-English-v1.5.1-b7.ipa
          if-no-files-found: error
      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: AvoCamUSB-English-source
          path: |
            AvoCamUSB/
            AvoCamUSBTests/
            project.yml
            README.md
            english-camera.patch
            TimestampTests.swift
